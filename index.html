<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanırım linux</title>
    <style>
        :root {
            --bg-dark: #282828;
            --bg-panel: #1d2021;
            --bg-chat: #282828;
            --fg-text: #ebdbb2;
            --fg-sub: #a89984;
            --accent-green: #b8bb26;
            --accent-yellow: #fabd2f;
            --accent-pink: #d3869b;
            --accent-blue: #83a598;
            --border-color: #3c3836;
            --hover-bg: #32302f;
            --danger-red: #fb4934;
            --mention-bg: rgba(131, 165, 152, 0.15);
            --mention-border: #83a598;
            --quote-bg: #32302f;
            --quote-border: #fabd2f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-dark); color: var(--fg-text); height: 100vh; display: flex; overflow: hidden; }

        /* MODAL (KULLANICI ADI & AVATAR GİRİŞİ) */
        #userModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 99; }
        .modal-card { background: var(--bg-panel); border: 1px solid var(--border-color); padding: 30px; border-radius: 8px; width: 90%; max-width: 400px; text-align: center; }
        .modal-card h3 { color: var(--accent-yellow); margin-bottom: 15px; }
        .modal-card input { width: 100%; padding: 12px; background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--fg-text); border-radius: 6px; font-size: 14px; margin-bottom: 12px; outline: none; }
        .modal-card input:focus { border-color: var(--accent-yellow); }
        .modal-card button { width: 100%; padding: 12px; background: var(--accent-yellow); border: none; font-weight: bold; color: var(--bg-dark); border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 5px; }

        /* DÜZENLEME MODALI */
        #editModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; }
        .edit-card { background: var(--bg-panel); border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; width: 90%; max-width: 500px; }
        .edit-card h4 { color: var(--accent-yellow); margin-bottom: 10px; }
        .edit-card textarea { width: 100%; height: 80px; background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--fg-text); border-radius: 6px; padding: 10px; resize: none; outline: none; font-family: inherit; margin-bottom: 10px; }
        .edit-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .edit-actions button { padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
        .btn-cancel { background: var(--border-color); color: var(--fg-text); }
        .btn-save { background: var(--accent-yellow); color: var(--bg-dark); }

        /* ANA EKRAN DÜZENİ */
        .app-container { display: flex; width: 100%; height: 100%; flex-direction: column; }

        /* BİLGİ VE KULLANICI BAR (ÜST) */
        .top-bar { padding: 12px 20px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .chat-info { display: flex; align-items: center; gap: 12px; font-weight: bold; font-size: 15px; }
        .status-dot { height: 8px; width: 8px; background-color: var(--accent-green); border-radius: 50%; display: inline-block; }
        
        /* AKTİF KULLANICILAR LİSTESİ */
        .online-users-list { display: flex; align-items: center; gap: -6px; margin-left: 10px; }
        .online-user-img { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--bg-panel); object-fit: cover; margin-left: -8px; transition: transform 0.2s; cursor: pointer; }
        .online-user-img:hover { transform: translateY(-2px) scale(1.1); z-index: 5; }

        .user-profile { display: flex; align-items: center; gap: 10px; }
        .user-profile img { width: 28px; height: 28px; border-radius: 4px; object-fit: cover; }
        .user-profile span { font-size: 13px; color: var(--accent-blue); font-weight: bold; }
        .btn-change-user { background: transparent; border: 1px solid var(--fg-sub); color: var(--fg-sub); padding: 2px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; }

        /* SOHBET ALANI */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); overflow: hidden; position: relative; }

        /* MESAJ LİSTESİ */
        .messages-container { flex: 1; padding: 20px 0; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }

        /* MESAJ ANİMASYONU */
        @keyframes msgSlideIn {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .message-group { display: flex; padding: 4px 20px; position: relative; width: 100%; }
        .message-group.animate-entry { animation: msgSlideIn 0.15s ease-out forwards; }
        .message-group:hover { background-color: var(--hover-bg); }

        .group-avatar { width: 36px; height: 36px; border-radius: 4px; margin-right: 12px; flex-shrink: 0; object-fit: cover; }
        
        .group-body { flex: 1; min-width: 0; }
        .group-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .sender-name { font-weight: bold; font-size: 14px; color: var(--accent-pink); }
        .header-time { font-size: 11px; color: var(--fg-sub); }

        .message-text-list { display: flex; flex-direction: column; gap: 6px; }
        .message-item { font-size: 14px; line-height: 1.5; color: var(--fg-text); word-break: break-word; white-space: pre-wrap; position: relative; display: flex; flex-direction: column; align-items: flex-start; padding: 4px 6px; border-radius: 4px; width: 100%; }
        .message-item code { background: var(--bg-panel); padding: 2px 5px; border-radius: 4px; font-family: monospace; font-size: 13px; color: var(--accent-yellow); border: 1px solid var(--border-color); }
        .message-item del { text-decoration: line-through; color: var(--fg-sub); }
        .message-item.animate-entry { animation: msgSlideIn 0.15s ease-out forwards; }
        .message-item:hover .message-actions { display: flex; }

        .message-content-wrapper { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 15px;}
        .msg-content { flex: 1; }

        /* LİNK VE MEDYA ÖNİZLEME STİLLERİ */
        .chat-link { color: var(--accent-blue); text-decoration: none; word-break: break-all; }
        .chat-link:hover { text-decoration: underline; }
        
        .media-preview {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            margin-top: 6px;
            display: block;
            border: 1px solid var(--border-color);
            background: var(--bg-panel);
            object-fit: contain;
        }

        /* ALINTI (QUOTE) MESAJ STİLLERİ */
        .quoted-box { background-color: var(--quote-bg); border-left: 3px solid var(--quote-border); padding: 3px 8px; border-radius: 3px; font-size: 12px; color: var(--fg-sub); margin-bottom: 4px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .quoted-sender { font-weight: bold; color: var(--accent-yellow); margin-right: 5px; }

        /* ETİKETLEME (MENTION) STİLLERİ */
        .mention-tag { color: var(--accent-blue); font-weight: bold; background: rgba(131, 165, 152, 0.2); padding: 0 4px; border-radius: 3px; }
        .message-item.is-mentioned { background-color: var(--mention-bg); border-left: 3px solid var(--mention-border); }

        /* MESAJ İŞLEM BUTONLARI (YANITLA, DÜZENLE, SİL) */
        .message-actions { display: none; flex-shrink: 0; gap: 4px; background: var(--bg-panel); border: 1px solid var(--border-color); padding: 2px 6px; border-radius: 4px; position: absolute; right: 10px; top: -6px; z-index: 10; }
        .action-btn { background: transparent; border: none; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; padding: 2px; }
        .action-btn.reply { color: var(--accent-blue); }
        .action-btn.reply:hover { color: var(--fg-text); }
        .action-btn.edit { color: var(--fg-sub); }
        .action-btn.edit:hover { color: var(--fg-text); }
        .action-btn.delete { color: var(--danger-red); }
        .action-btn.delete:hover { opacity: 0.8; }

        /* YAZIYOR İNDİKATÖRÜ */
        .typing-indicator { padding: 4px 20px; font-size: 12px; font-style: italic; color: var(--accent-yellow); height: 20px; display: flex; align-items: center; }

        /* ALINTI PREVIEW BAR (INPUT ÜSTÜ) */
        .reply-preview-bar { background: var(--bg-panel); border-top: 1px solid var(--border-color); padding: 6px 20px; display: none; justify-content: space-between; align-items: center; font-size: 12px; color: var(--fg-sub); }
        .reply-preview-content { display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .reply-preview-user { font-weight: bold; color: var(--accent-yellow); }
        .btn-cancel-reply { background: transparent; border: none; color: var(--danger-red); font-size: 14px; cursor: pointer; font-weight: bold; margin-left: 10px; }

        /* MESAJ INPUT */
        .input-area { padding: 15px 20px; background: var(--bg-panel); border-top: 1px solid var(--border-color); display: flex; gap: 10px; }
        .input-area textarea { flex: 1; background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--fg-text); border-radius: 6px; padding: 12px; resize: none; height: 46px; font-family: inherit; font-size: 14px; outline: none; }
        .input-area textarea:focus { border-color: var(--accent-yellow); }
        .input-area button { background: var(--accent-yellow); border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; color: var(--bg-dark); cursor: pointer; }
    </style>
</head>
<body>

    <div id="userModal">
        <div class="modal-card">
            <h3>Instant Chat</h3>
            <p style="color: var(--fg-sub); font-size: 13px; margin-bottom: 15px;">Bilgilerinizi girin ve anlık sohbete başlayın.</p>
            <input type="text" id="usernameInput" placeholder="Kullanıcı Adınız..." required />
            <input type="url" id="avatarInput" placeholder="Profil Resmi URL (İsteğe bağlı)" />
            <button id="joinBtn">Sohbete Katıl</button>
        </div>
    </div>

    <div id="editModal">
        <div class="edit-card">
            <h4>Mesajı Düzenle</h4>
            <textarea id="editMessageInput"></textarea>
            <div class="edit-actions">
                <button class="btn-cancel" id="cancelEditBtn">İptal</button>
                <button class="btn-save" id="saveEditBtn">Kaydet</button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <div class="top-bar">
            <div class="chat-info">
                <span class="status-dot"></span>
                <span>SQLite Database killers</span>
                <div class="online-users-list" id="onlineUsersList"></div>
            </div>
            <div class="user-profile">
                <img id="myAvatar" src="" alt="Profil">
                <span id="displayUsername">...</span>
                <button class="btn-change-user" id="resetUserBtn">Değiştir</button>
            </div>
        </div>

        <div class="chat-area">
            <div class="messages-container" id="messagesList">
                <div style="color:var(--fg-sub); text-align:center; padding-top: 20px;" id="loadingText">Bağlanıyor...</div>
            </div>

            <div class="typing-indicator" id="typingIndicator"></div>

            <div class="reply-preview-bar" id="replyPreviewBar">
                <div class="reply-preview-content">
                    <span>Yanıtlanıyor:</span>
                    <span class="reply-preview-user" id="replyPreviewUser">@kullanıcı</span>
                    <span id="replyPreviewText">"Mesaj içeriği..."</span>
                </div>
                <button class="btn-cancel-reply" id="cancelReplyBtn" title="İptal Et">✕</button>
            </div>

            <form class="input-area" id="chatForm">
                <textarea id="messageInput" placeholder="Bir mesaj yazın..." required></textarea>
                <button type="submit">Gönder</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, onChildChanged, onChildRemoved, onValue, serverTimestamp, remove, update, onDisconnect, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRiCdkBRsKMeUpCmznQ3Sn8R6SvBk0C9U",
            authDomain: "messges-87869.firebaseapp.com",
            databaseURL: "https://messges-87869-default-rtdb.firebaseio.com",
            projectId: "messges-87869",
            storageBucket: "messges-87869.firebasestorage.app",
            messagingSenderId: "102076170891",
            appId: "1:102076170891:web:8786547acdbcdfb1468a8e"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const messagesRef = ref(database, 'messages');
        const onlineRef = ref(database, 'online_users');
        const typingRef = ref(database, 'typing');

        let currentUser = localStorage.getItem('gh_chat_username') || "";
        let currentAvatar = localStorage.getItem('gh_chat_avatar') || "";
        let activeEditKey = null;
        let activeReplyTarget = null; 
        let typingTimeout = null;
        let myUserRef = null;
        let myTypingRef = null;

        const userModal = document.getElementById('userModal');
        const editModal = document.getElementById('editModal');
        const editMessageInput = document.getElementById('editMessageInput');
        const displayUsername = document.getElementById('displayUsername');
        const myAvatar = document.getElementById('myAvatar');
        const messagesList = document.getElementById('messagesList');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const onlineUsersList = document.getElementById('onlineUsersList');
        const typingIndicator = document.getElementById('typingIndicator');
        const replyPreviewBar = document.getElementById('replyPreviewBar');
        const replyPreviewUser = document.getElementById('replyPreviewUser');
        const replyPreviewText = document.getElementById('replyPreviewText');

        function getAvatarUrl(username, customUrl) {
            if (customUrl && customUrl.trim() !== "") return customUrl;
            return `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(username)}`;
        }

        function initUserSession() {
            if (!currentUser) return;
            userModal.style.display = 'none';
            displayUsername.innerText = currentUser;
            myAvatar.src = getAvatarUrl(currentUser, currentAvatar);

            const connectedRef = ref(database, '.info/connected');
            onValue(connectedRef, (snap) => {
                if (snap.val() === true) {
                    myUserRef = push(onlineRef);
                    myTypingRef = ref(database, `typing/${currentUser}`);

                    onDisconnect(myUserRef).remove();
                    onDisconnect(myTypingRef).remove();

                    set(myUserRef, { username: currentUser, avatar: getAvatarUrl(currentUser, currentAvatar) });
                }
            });
        }

        if (currentUser) {
            initUserSession();
        }

        document.getElementById('joinBtn').addEventListener('click', () => {
            const username = document.getElementById('usernameInput').value.trim();
            const avatarUrl = document.getElementById('avatarInput').value.trim();
            if (username) {
                currentUser = username;
                currentAvatar = avatarUrl;
                localStorage.setItem('gh_chat_username', currentUser);
                localStorage.setItem('gh_chat_avatar', currentAvatar);
                initUserSession();
            }
        });

        document.getElementById('resetUserBtn').addEventListener('click', () => {
            if (myUserRef) remove(myUserRef);
            if (myTypingRef) remove(myTypingRef);
            localStorage.removeItem('gh_chat_username');
            localStorage.removeItem('gh_chat_avatar');
            location.reload();
        });

        onValue(onlineRef, (snapshot) => {
            const data = snapshot.val();
            onlineUsersList.innerHTML = "";
            if (!data) return;

            const uniqueUsers = {};
            Object.values(data).forEach(u => uniqueUsers[u.username] = u.avatar);

            Object.entries(uniqueUsers).forEach(([username, avatar]) => {
                const img = document.createElement('img');
                img.className = 'online-user-img';
                img.src = avatar;
                img.title = username;
                img.alt = username;
                img.onerror = function() { this.src = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(username)}`; };
                img.addEventListener('click', () => {
                    messageInput.value += `@${username} `;
                    messageInput.focus();
                });
                onlineUsersList.appendChild(img);
            });
        });

        messageInput.addEventListener('input', () => {
            if (!currentUser) return;
            set(ref(database, `typing/${currentUser}`), true);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => remove(ref(database, `typing/${currentUser}`)), 2000);
        });

        onValue(typingRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) { typingIndicator.innerText = ""; return; }
            const typers = Object.keys(data).filter(user => user.toLowerCase() !== currentUser.toLowerCase());
            
            if (typers.length === 1) typingIndicator.innerText = `${typers[0]} yazıyor...`;
            else if (typers.length > 1) typingIndicator.innerText = `${typers.join(', ')} yazıyor...`;
            else typingIndicator.innerText = "";
        });

        onChildAdded(messagesRef, (snapshot) => {
            const loadingEl = document.getElementById('loadingText');
            if (loadingEl) loadingEl.remove();

            const msg = { key: snapshot.key, ...snapshot.val() };
            const dateObj = msg.timestamp ? new Date(msg.timestamp) : new Date();
            const timeStr = dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });

            const lastGroup = messagesList.lastElementChild;
            const lastSender = lastGroup ? lastGroup.dataset.sender : null;
            const lastTime = lastGroup ? parseInt(lastGroup.dataset.timestamp || '0') : 0;

            const isSameSender = lastSender === msg.sender;
            const isWithin1Min = (msg.timestamp - lastTime) / 1000 < 60;

            if (isSameSender && isWithin1Min && lastGroup) {
                const textContainer = lastGroup.querySelector('.message-text-list');
                addMessageToGroup(textContainer, msg, true);
            } else {
                const groupEl = document.createElement('div');
                groupEl.className = 'message-group animate-entry';
                groupEl.dataset.sender = msg.sender;
                groupEl.dataset.timestamp = msg.timestamp || Date.now();

                const avatarUrl = getAvatarUrl(msg.sender, msg.avatar);

                groupEl.innerHTML = `
                    <img class="group-avatar" src="${escapeHTML(avatarUrl)}" alt="${escapeHTML(msg.sender)}" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(msg.sender)}'">
                    <div class="group-body">
                        <div class="group-header">
                            <span class="sender-name">${escapeHTML(msg.sender)}</span>
                            <span class="header-time">${timeStr}</span>
                        </div>
                        <div class="message-text-list"></div>
                    </div>
                `;

                const textContainer = groupEl.querySelector('.message-text-list');
                addMessageToGroup(textContainer, msg, false);
                messagesList.appendChild(groupEl);
            }
            messagesList.scrollTop = messagesList.scrollHeight;
        });

        onChildChanged(messagesRef, (snapshot) => {
            const key = snapshot.key;
            const updatedData = snapshot.val();
            const btn = messagesList.querySelector(`[data-key="${key}"]`);
            if (btn) {
                const item = btn.closest('.message-item');
                const span = item.querySelector('.msg-content');
                if (span) span.innerHTML = parseMarkdown(updatedData.text);
                
                const isMentioned = currentUser && updatedData.text.toLowerCase().includes(`@${currentUser.toLowerCase()}`);
                if (isMentioned) item.classList.add('is-mentioned');
                else item.classList.remove('is-mentioned');

                const editBtn = item.querySelector('.action-btn.edit');
                const replyBtn = item.querySelector('.action-btn.reply');
                if (editBtn) editBtn.setAttribute('data-text', escapeHTML(updatedData.text));
                if (replyBtn) replyBtn.setAttribute('data-text', escapeHTML(updatedData.text));
            }
        });

        onChildRemoved(messagesRef, (snapshot) => {
            const key = snapshot.key;
            const btn = messagesList.querySelector(`[data-key="${key}"]`);
            if (btn) {
                const item = btn.closest('.message-item');
                const group = item.closest('.message-group');
                item.remove();
                if (group && group.querySelectorAll('.message-item').length === 0) group.remove();
            }
        });

        function addMessageToGroup(container, msg, animateItem = false) {
            const item = document.createElement('div');
            item.className = 'message-item' + (animateItem ? ' animate-entry' : '');
            
            const isMe = msg.sender.toLowerCase() === currentUser.toLowerCase();
            const isMentioned = currentUser && msg.text.toLowerCase().includes(`@${currentUser.toLowerCase()}`);

            if (isMentioned) item.classList.add('is-mentioned');

            let quoteHTML = '';
            if (msg.replyTo) {
                quoteHTML = `
                    <div class="quoted-box">
                        <span class="quoted-sender">@${escapeHTML(msg.replyTo.sender)}</span>
                        <span>${escapeHTML(msg.replyTo.text)}</span>
                    </div>
                `;
            }

            let editBtnHTML = '';
            let deleteBtnHTML = '';

            if (isMe) {
                editBtnHTML = `<button class="action-btn edit" data-key="${msg.key}" data-text="${escapeHTML(msg.text)}" title="Düzenle"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>`;
                deleteBtnHTML = `<button class="action-btn delete" data-key="${msg.key}" title="Sil"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>`;
            }

            const actionsHTML = `
                <div class="message-actions">
                    <button class="action-btn reply" data-key="${msg.key}" data-sender="${escapeHTML(msg.sender)}" data-text="${escapeHTML(msg.text)}" title="Yanıtla">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 17 4 12 9 7"></polyline><path d="M20 18v-2a4 4 0 0 0-4-4H4"></path></svg>
                    </button>
                    ${editBtnHTML}
                    ${deleteBtnHTML}
                </div>
            `;

            item.innerHTML = `
                ${quoteHTML}
                <div class="message-content-wrapper">
                    <span class="msg-content">${parseMarkdown(msg.text)}</span>
                    ${actionsHTML}
                </div>
            `;

            container.appendChild(item);
        }

        messagesList.addEventListener('click', (e) => {
            const deleteBtn = e.target.closest('.action-btn.delete');
            const editBtn = e.target.closest('.action-btn.edit');
            const replyBtn = e.target.closest('.action-btn.reply');

            if (deleteBtn) {
                const key = deleteBtn.getAttribute('data-key');
                if (confirm('Bu mesajı silmek istediğinize emin misiniz?')) remove(ref(database, `messages/${key}`));
            }

            if (editBtn) {
                activeEditKey = editBtn.getAttribute('data-key');
                editMessageInput.value = editBtn.getAttribute('data-text');
                editModal.style.display = 'flex';
            }

            if (replyBtn) {
                const sender = replyBtn.getAttribute('data-sender');
                const text = replyBtn.getAttribute('data-text');
                activeReplyTarget = { sender, text };
                replyPreviewUser.innerText = `@${sender}`;
                replyPreviewText.innerText = `"${text}"`;
                replyPreviewBar.style.display = 'flex';
                messageInput.focus();
            }
        });

        document.getElementById('cancelReplyBtn').addEventListener('click', () => {
            activeReplyTarget = null;
            replyPreviewBar.style.display = 'none';
        });

        document.getElementById('cancelEditBtn').addEventListener('click', () => {
            editModal.style.display = 'none';
            activeEditKey = null;
        });

        document.getElementById('saveEditBtn').addEventListener('click', () => {
            const newText = editMessageInput.value.trim();
            if (newText && activeEditKey) {
                update(ref(database, `messages/${activeEditKey}`), { text: newText });
                editModal.style.display = 'none';
                activeEditKey = null;
            }
        });

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !currentUser) return;

            const payload = { sender: currentUser, avatar: currentAvatar, text: text, timestamp: serverTimestamp() };
            if (activeReplyTarget) payload.replyTo = activeReplyTarget;

            push(messagesRef, payload);

            remove(ref(database, `typing/${currentUser}`));
            clearTimeout(typingTimeout);

            messageInput.value = "";
            activeReplyTarget = null;
            replyPreviewBar.style.display = 'none';
        });

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        function parseMarkdown(str) {
            if (!str) return '';
            let html = escapeHTML(str);

            // Adım 1: Code bloklarını (``` veya `) korumaya al
            const codeBlocks = [];
            html = html.replace(/`(.*?)`/g, (match, p1) => {
                codeBlocks.push(`<code>${p1}</code>`);
                return `___CODE_BLOCK_${codeBlocks.length - 1}___`;
            });

            // Adım 2: URL'leri tespit et ve Link/Medya önizlemesine çevir
            const urlBlocks = [];
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            html = html.replace(urlRegex, (url) => {
                const isImg = /\.(jpeg|jpg|gif|png|webp)(\?.*)?$/i.test(url);
                const isVid = /\.(mp4|webm|ogg)(\?.*)?$/i.test(url);
                
                let previewHTML = '';
                if (isImg) {
                    previewHTML = `<img src="${url}" class="media-preview" alt="Görsel Önizleme" loading="lazy">`;
                } else if (isVid) {
                    previewHTML = `<video src="${url}" class="media-preview" controls preload="metadata"></video>`;
                }
                
                const linkHTML = `<a href="${url}" target="_blank" rel="noopener noreferrer" class="chat-link">${url}</a>${previewHTML}`;
                
                urlBlocks.push(linkHTML);
                return `___URL_BLOCK_${urlBlocks.length - 1}___`;
            });

            // Adım 3: Diğer Markdown kurallarını uygula
            html = html.replace(/@([a-zA-Z0-9_ğüşıöçĞÜŞİÖÇ]+)/g, '<span class="mention-tag">@$1</span>');
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            html = html.replace(/_(.*?)_/g, '<em>$1</em>');
            html = html.replace(/~~(.*?)~~/g, '<del>$1</del>');

            // Adım 4: Korumaya alınan URL ve Code bloklarını geri yerleştir
            urlBlocks.forEach((block, i) => { 
                html = html.replace(new RegExp(`___URL_BLOCK_${i}___`, 'g'), block); 
            });
            codeBlocks.forEach((block, i) => { 
                html = html.replace(new RegExp(`___CODE_BLOCK_${i}___`, 'g'), block); 
            });

            return html;
        }
    </script>
</body>
</html>
