<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Gruvbox Chat</title>
    <!-- Marked.js for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-dark: #282828;
            --bg-panel: #1d2021;
            --bg-chat: #282828;
            --fg-text: #ebdbb2;
            --fg-sub: #a89984;
            --accent-green: #b8bb26;
            --accent-yellow: #fabd2f;
            --accent-pink: #d3869b;
            --accent-blue: #83a598;
            --border-color: #3c3836;
            --hover-bg: #32302f;
            --danger-red: #fb4934;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-dark); color: var(--fg-text); height: 100vh; display: flex; overflow: hidden; }

        /* MODAL (VARSAYILAN OLARAK GİZLİ) */
        #userModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 99; }
        .modal-card { background: var(--bg-panel); border: 1px solid var(--border-color); padding: 30px; border-radius: 8px; width: 90%; max-width: 400px; text-align: center; }
        .modal-card h3 { color: var(--accent-yellow); margin-bottom: 15px; }
        .modal-card input { width: 100%; padding: 12px; background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--fg-text); border-radius: 6px; font-size: 14px; margin-bottom: 12px; outline: none; }
        .modal-card input:focus { border-color: var(--accent-yellow); }
        .modal-card button { width: 100%; padding: 12px; background: var(--accent-yellow); border: none; font-weight: bold; color: var(--bg-dark); border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 5px; }

        /* DÜZENLEME MODALI */
        #editModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; }
        .edit-card { background: var(--bg-panel); border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; width: 90%; max-width: 500px; }
        .edit-card h4 { color: var(--accent-yellow); margin-bottom: 10px; }
        .edit-card textarea { width: 100%; height: 80px; background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--fg-text); border-radius: 6px; padding: 10px; resize: none; outline: none; font-family: inherit; margin-bottom: 10px; }
        .edit-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .edit-actions button { padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
        .btn-cancel { background: var(--border-color); color: var(--fg-text); }
        .btn-save { background: var(--accent-yellow); color: var(--bg-dark); }

        /* ANA EKRAN DÜZENİ */
        .app-container { display: flex; width: 100%; height: 100%; flex-direction: column; }

        /* BİLGİ VE KULLANICI BAR (ÜST) */
        .top-bar { padding: 12px 20px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .chat-info { display: flex; align-items: center; gap: 12px; font-weight: bold; font-size: 15px; }
        .status-dot { height: 8px; width: 8px; background-color: var(--accent-green); border-radius: 50%; display: inline-block; }
        
        .online-users-list { display: flex; align-items: center; gap: -6px; margin-left: 10px; }
        .online-user-img { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--bg-panel); object-fit: cover; margin-left: -8px; transition: transform 0.2s; cursor: pointer; }
        .online-user-img:hover { transform: translateY(-2px) scale(1.1); z-index: 5; }

        .user-profile { display: flex; align-items: center; gap: 10px; }
        .user-profile img { width: 28px; height: 28px; border-radius: 4px; object-fit: cover; }
        .user-profile span { font-size: 13px; color: var(--accent-blue); font-weight: bold; }
        .btn-change-user { background: transparent; border: 1px solid var(--fg-sub); color: var(--fg-sub); padding: 2px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; }

        /* SOHBET ALANI */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); overflow: hidden; position: relative; }

        /* MESAJ LİSTESİ */
        .messages-container { flex: 1; padding: 20px 0; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }

        /* MESAJ ANİMASYONU */
        @keyframes msgSlideIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .message-group { display: flex; padding: 4px 20px; position: relative; width: 100%; }
        .message-group.animate-entry { animation: msgSlideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .message-group:hover { background-color: var(--hover-bg); }

        .group-avatar { width: 36px; height: 36px; border-radius: 4px; margin-right: 12px; flex-shrink: 0; object-fit: cover; }
        .group-body { flex: 1; min-width: 0; }
        .group-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .sender-name { font-weight: bold; font-size: 14px; color: var(--accent-pink); }
        .header-time { font-size: 11px; color: var(--fg-sub); }

        .message-text-list { display: flex; flex-direction: column; gap: 4px; }
        .message-item { font-size: 14px; line-height: 1.5; color: var(--fg-text); word-break: break-word; position: relative; display: flex; justify-content: space-between; align-items: flex-start; }
        .message-item.animate-entry { animation: msgSlideIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .message-item:hover .message-actions { display: flex; }

        /* MARKDOWN FORMATLAMA STİLLERİ */
        .markdown-content { width: 100%; }
        .markdown-content p { margin: 0; display: inline-block; }
        .markdown-content p + p { margin-top: 4px; }
        .markdown-content code { background: var(--bg-panel); color: var(--accent-yellow); padding: 2px 5px; border-radius: 4px; font-family: monospace; font-size: 13px; }
        .markdown-content pre { background: var(--bg-panel); padding: 8px; border-radius: 4px; overflow-x: auto; margin: 4px 0; border: 1px solid var(--border-color); }
        .markdown-content pre code { background: transparent; padding: 0; color: var(--fg-text); }
        .markdown-content a { color: var(--accent-blue); text-decoration: underline; }
        .markdown-content blockquote { border-left: 3px solid var(--accent-yellow); padding-left: 8px; color: var(--fg-sub); font-style: italic; margin: 4px 0; }

        /* DÜZENLE/SİL HOVER BUTONLARI */
        .message-actions { display: none; gap: 6px; background: var(--bg-panel); border: 1px solid var(--border-color); padding: 2px 6px; border-radius: 4px; position: absolute; right: 10px; top: -6px; z-index: 10; }
        .action-btn { background: transparent; border: none; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; padding: 2px; }
        .action-btn.edit { color: var(--fg-sub); }
        .action-btn.edit:hover { color: var(--fg-text); }
        .action-btn.delete { color: var(--danger-red); }
        .action-btn.delete:hover { opacity: 0.8; }

        /* YAZIYOR İNDİKATÖRÜ */
        .typing-indicator { padding: 4px 20px; font-size: 12px; font-style: italic; color: var(--accent-yellow); height: 20px; display: flex; align-items: center; }

        /* MESAJ INPUT VE TOOLBAR */
        .input-wrapper { background: var(--bg-panel); border-top: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .toolbar { padding: 6px 20px 0 20px; display: flex; gap: 6px; }
        .tool-btn { background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--fg-sub); padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; transition: background 0.2s, color 0.2s; }
        .tool-btn:hover { color: var(--fg-text); border-color: var(--accent-yellow); }

        .input-area { padding: 10px 20px 15px 20px; display: flex; gap: 10px; }
        .input-area textarea { flex: 1; background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--fg-text); border-radius: 6px; padding: 12px; resize: none; height: 46px; font-family: inherit; font-size: 14px; outline: none; }
        .input-area textarea:focus { border-color: var(--accent-yellow); }
        .input-area button { background: var(--accent-yellow); border: none; padding: 0 20px; border-radius: 6px; font-weight: bold; color: var(--bg-dark); cursor: pointer; }
    </style>
</head>
<body>

    <div id="userModal">
        <div class="modal-card">
            <h3>Instant Chat</h3>
            <p style="color: var(--fg-sub); font-size: 13px; margin-bottom: 15px;">Bilgilerinizi girin ve anlık sohbete başlayın.</p>
            <input type="text" id="usernameInput" placeholder="Kullanıcı Adınız..." required />
            <input type="url" id="avatarInput" placeholder="Profil Resmi URL (İsteğe bağlı)" />
            <button id="joinBtn">Sohbete Katıl</button>
        </div>
    </div>

    <div id="editModal">
        <div class="edit-card">
            <h4>Mesajı Düzenle</h4>
            <textarea id="editMessageInput"></textarea>
            <div class="edit-actions">
                <button class="btn-cancel" id="cancelEditBtn">İptal</button>
                <button class="btn-save" id="saveEditBtn">Kaydet</button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <div class="top-bar">
            <div class="chat-info">
                <span class="status-dot"></span>
                <span># global-chat</span>
                <div class="online-users-list" id="onlineUsersList"></div>
            </div>
            <div class="user-profile">
                <img id="myAvatar" src="" alt="Profil">
                <span id="displayUsername">...</span>
                <button class="btn-change-user" id="resetUserBtn">Değiştir</button>
            </div>
        </div>

        <div class="chat-area">
            <div class="messages-container" id="messagesList">
                <div style="color:var(--fg-sub); text-align:center; padding-top: 20px;">Bağlanıyor...</div>
            </div>

            <div class="typing-indicator" id="typingIndicator"></div>

            <div class="input-wrapper">
                <div class="toolbar">
                    <button class="tool-btn" data-prefix="**" data-suffix="**"><b>B</b></button>
                    <button class="tool-btn" data-prefix="*" data-suffix="*"><i>I</i></button>
                    <button class="tool-btn" data-prefix="`" data-suffix="`">&lt;/&gt;</button>
                    <button class="tool-btn" data-prefix="~~" data-suffix="~~"><s>S</s></button>
                    <button class="tool-btn" data-prefix="[" data-suffix="](url)">Link</button>
                </div>
                <form class="input-area" id="chatForm">
                    <textarea id="messageInput" placeholder="Bir mesaj yazın... (Markdown desteklenir)" required></textarea>
                    <button type="submit">Gönder</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, serverTimestamp, remove, update, onDisconnect, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        marked.setOptions({ gfm: true, breaks: true });

        const firebaseConfig = {
            apiKey: "AIzaSyDRiCdkBRsKMeUpCmznQ3Sn8R6SvBk0C9U",
            authDomain: "messges-87869.firebaseapp.com",
            databaseURL: "https://messges-87869-default-rtdb.firebaseio.com",
            projectId: "messges-87869",
            storageBucket: "messges-87869.firebasestorage.app",
            messagingSenderId: "102076170891",
            appId: "1:102076170891:web:8786547acdbcdfb1468a8e"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const messagesRef = ref(database, 'messages');
        const onlineRef = ref(database, 'online_users');
        const typingRef = ref(database, 'typing');

        let currentUser = localStorage.getItem('gh_chat_username') || "";
        let currentAvatar = localStorage.getItem('gh_chat_avatar') || "";
        let activeEditKey = null;
        let typingTimeout = null;
        let myUserRef = null;
        let myTypingRef = null;
        
        const renderedMessageKeys = new Set();
        let isFirstRender = true;

        const userModal = document.getElementById('userModal');
        const editModal = document.getElementById('editModal');
        const editMessageInput = document.getElementById('editMessageInput');
        const displayUsername = document.getElementById('displayUsername');
        const myAvatar = document.getElementById('myAvatar');
        const messagesList = document.getElementById('messagesList');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const onlineUsersList = document.getElementById('onlineUsersList');
        const typingIndicator = document.getElementById('typingIndicator');

        function getAvatarUrl(username, customUrl) {
            if (customUrl && customUrl.trim() !== "") return customUrl;
            return `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(username)}`;
        }

        function startChatListeners() {
            // AKTİF KULLANICILAR DİNLEME
            onValue(onlineRef, (snapshot) => {
                const data = snapshot.val();
                onlineUsersList.innerHTML = "";
                if (!data) return;

                const uniqueUsers = {};
                Object.values(data).forEach(u => { uniqueUsers[u.username] = u.avatar; });

                Object.entries(uniqueUsers).forEach(([username, avatar]) => {
                    const img = document.createElement('img');
                    img.className = 'online-user-img';
                    img.src = avatar;
                    img.title = username;
                    img.alt = username;
                    img.onerror = function() {
                        this.src = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(username)}`;
                    };
                    onlineUsersList.appendChild(img);
                });
            });

            // YAZIYOR DURUMUNU DİNLEME
            onValue(typingRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    typingIndicator.innerText = "";
                    return;
                }
                const typers = Object.keys(data).filter(user => user.toLowerCase() !== currentUser.toLowerCase());
                if (typers.length === 1) typingIndicator.innerText = `${typers[0]} yazıyor...`;
                else if (typers.length > 1) typingIndicator.innerText = `${typers.join(', ')} yazıyor...`;
                else typingIndicator.innerText = "";
            });

            // MESAJLARI DİNLEME
            onValue(messagesRef, (snapshot) => {
                const data = snapshot.val();
                messagesList.innerHTML = "";

                if (!data) {
                    messagesList.innerHTML = '<div style="color:var(--fg-sub); text-align:center; padding-top: 20px;">Henüz mesaj yok. İlk mesajı sen at!</div>';
                    isFirstRender = false;
                    renderedMessageKeys.clear();
                    return;
                }

                const rawMessages = Object.entries(data).map(([key, value]) => ({ key, ...value }));
                
                let lastSender = null;
                let lastTimestamp = 0;
                let currentGroupEl = null;
                let currentTextContainer = null;

                rawMessages.forEach((msg) => {
                    const isSameSender = lastSender === msg.sender;
                    const timeDiff = (msg.timestamp - lastTimestamp) / 1000;
                    const isWithin1Min = timeDiff < 60;

                    const dateObj = msg.timestamp ? new Date(msg.timestamp) : new Date();
                    const timeStr = dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
                    const isBrandNewMessage = !isFirstRender && !renderedMessageKeys.has(msg.key);

                    if (isSameSender && isWithin1Min && currentGroupEl) {
                        addMessageToGroup(currentTextContainer, msg, isBrandNewMessage);
                    } else {
                        currentGroupEl = document.createElement('div');
                        currentGroupEl.className = 'message-group' + (isBrandNewMessage ? ' animate-entry' : '');

                        const avatarUrl = getAvatarUrl(msg.sender, msg.avatar);

                        currentGroupEl.innerHTML = `
                            <img class="group-avatar" src="${escapeHTML(avatarUrl)}" alt="${escapeHTML(msg.sender)}" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(msg.sender)}'">
                            <div class="group-body">
                                <div class="group-header">
                                    <span class="sender-name">${escapeHTML(msg.sender)}</span>
                                    <span class="header-time">${timeStr}</span>
                                </div>
                                <div class="message-text-list"></div>
                            </div>
                        `;

                        currentTextContainer = currentGroupEl.querySelector('.message-text-list');
                        addMessageToGroup(currentTextContainer, msg, isBrandNewMessage && !currentGroupEl.classList.contains('animate-entry'));
                        messagesList.appendChild(currentGroupEl);
                    }

                    renderedMessageKeys.add(msg.key);
                    lastSender = msg.sender;
                    lastTimestamp = msg.timestamp || Date.now();
                });

                isFirstRender = false;
                messagesList.scrollTop = messagesList.scrollHeight;
            });
        }

        function initUserSession() {
            if (!currentUser) {
                userModal.style.display = 'flex';
                return;
            }

            userModal.style.display = 'none';
            displayUsername.innerText = currentUser;
            myAvatar.src = getAvatarUrl(currentUser, currentAvatar);

            const connectedRef = ref(database, '.info/connected');
            onValue(connectedRef, (snap) => {
                if (snap.val() === true) {
                    myUserRef = push(onlineRef);
                    myTypingRef = ref(database, `typing/${currentUser}`);

                    onDisconnect(myUserRef).remove();
                    onDisconnect(myTypingRef).remove();

                    set(myUserRef, {
                        username: currentUser,
                        avatar: getAvatarUrl(currentUser, currentAvatar)
                    });
                }
            });

            startChatListeners();
        }

        // OTURUMU BAŞLAT
        initUserSession();

        document.getElementById('joinBtn').addEventListener('click', () => {
            const username = document.getElementById('usernameInput').value.trim();
            const avatarUrl = document.getElementById('avatarInput').value.trim();

            if (username) {
                currentUser = username;
                currentAvatar = avatarUrl;

                localStorage.setItem('gh_chat_username', currentUser);
                localStorage.setItem('gh_chat_avatar', currentAvatar);

                initUserSession();
            }
        });

        document.getElementById('resetUserBtn').addEventListener('click', () => {
            if (myUserRef) remove(myUserRef);
            if (myTypingRef) remove(myTypingRef);
            localStorage.removeItem('gh_chat_username');
            localStorage.removeItem('gh_chat_avatar');
            location.reload();
        });

        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const prefix = btn.getAttribute('data-prefix');
                const suffix = btn.getAttribute('data-suffix');
                
                const start = messageInput.selectionStart;
                const end = messageInput.selectionEnd;
                const text = messageInput.value;
                const selectedText = text.substring(start, end);

                const replacement = prefix + selectedText + suffix;
                messageInput.value = text.substring(0, start) + replacement + text.substring(end);
                
                messageInput.focus();
                messageInput.setSelectionRange(start + prefix.length, end + prefix.length);
            });
        });

        messageInput.addEventListener('input', () => {
            if (!currentUser) return;

            set(ref(database, `typing/${currentUser}`), true);

            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                remove(ref(database, `typing/${currentUser}`));
            }, 2000);
        });

        function addMessageToGroup(container, msg, animateItem = false) {
            const item = document.createElement('div');
            item.className = 'message-item' + (animateItem ? ' animate-entry' : '');
            
            const isMe = msg.sender.toLowerCase() === currentUser.toLowerCase();

            let actionsHTML = '';
            if (isMe) {
                actionsHTML = `
                    <div class="message-actions">
                        <button class="action-btn edit" data-key="${msg.key}" data-text="${escapeHTML(msg.text)}" title="Düzenle">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        </button>
                        <button class="action-btn delete" data-key="${msg.key}" title="Sil">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                `;
            }

            const formattedText = marked.parse(escapeHTML(msg.text));

            item.innerHTML = `
                <div class="markdown-content">${formattedText}</div>
                ${actionsHTML}
            `;

            container.appendChild(item);
        }

        messagesList.addEventListener('click', (e) => {
            const deleteBtn = e.target.closest('.action-btn.delete');
            const editBtn = e.target.closest('.action-btn.edit');

            if (deleteBtn) {
                const key = deleteBtn.getAttribute('data-key');
                if (confirm('Bu mesajı silmek istediğinize emin misiniz?')) {
                    remove(ref(database, `messages/${key}`));
                }
            }

            if (editBtn) {
                activeEditKey = editBtn.getAttribute('data-key');
                const oldText = editBtn.getAttribute('data-text');
                editMessageInput.value = oldText;
                editModal.style.display = 'flex';
            }
        });

        document.getElementById('cancelEditBtn').addEventListener('click', () => {
            editModal.style.display = 'none';
            activeEditKey = null;
        });

        document.getElementById('saveEditBtn').addEventListener('click', () => {
            const newText = editMessageInput.value.trim();
            if (newText && activeEditKey) {
                update(ref(database, `messages/${activeEditKey}`), {
                    text: newText
                });
                editModal.style.display = 'none';
                activeEditKey = null;
            }
        });

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !currentUser) return;

            push(messagesRef, {
                sender: currentUser,
                avatar: currentAvatar,
                text: text,
                timestamp: serverTimestamp()
            });

            remove(ref(database, `typing/${currentUser}`));
            clearTimeout(typingTimeout);

            messageInput.value = "";
        });

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
