<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gruvbox Chat</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-hard: #1d2021;
            --bg: #282828;
            --bg-soft: #3c3836;
            --bg-element: #504945;
            --fg: #ebdbb2;
            --fg-dim: #a89984;
            --yellow: #fabd2f;
            --green: #b8bb26;
            --red: #fb4934;
            --blue: #83a598;
            --purple: #d3869b;
            --aqua: #8ec07c;
            --orange: #fe8019;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-hard);
            color: var(--fg);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* App Layout (Cinny style) */
        .app-container {
            width: 100%;
            max-width: 1200px;
            height: 95vh;
            background-color: var(--bg);
            border-radius: 12px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--bg-soft);
        }

        /* Modal / Username Screen */
        .login-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(29, 32, 33, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-box {
            background-color: var(--bg);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--bg-soft);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .login-box h2 {
            color: var(--yellow);
            margin-bottom: 1.5rem;
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-soft);
            border: 1px solid var(--bg-element);
            border-radius: 8px;
            color: var(--fg);
            font-size: 1rem;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--yellow);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--yellow);
            color: var(--bg-hard);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background-color: var(--bg-hard);
            border-right: 1px solid var(--bg-soft);
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--yellow);
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            padding-left: 0.5rem;
        }

        .section-title {
            color: var(--fg-dim);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            padding-left: 0.5rem;
        }

        .user-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 4px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--bg-soft);
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background-color: var(--green);
            border-radius: 50%;
            display: inline-block;
        }

        /* Main Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg);
        }

        .chat-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--bg-soft);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* MESAJ ANİMASYONU VE STİLLERİ */
        @keyframes messagePop {
            0% {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message-item {
            display: flex;
            gap: 12px;
            max-width: 80%;
        }

        .message-animate {
            animation: messagePop 0.25s ease-out forwards;
        }

        .message-item.me {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .msg-bubble {
            background-color: var(--bg-soft);
            padding: 10px 14px;
            border-radius: 12px;
            position: relative;
        }

        .message-item.me .msg-bubble {
            background-color: var(--bg-element);
            color: var(--fg);
        }

        .msg-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .msg-sender {
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--yellow);
        }

        .message-item.me .msg-sender {
            color: var(--aqua);
        }

        .msg-time {
            font-size: 0.7rem;
            color: var(--fg-dim);
        }

        .msg-text {
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .typing-indicator {
            padding: 0.5rem 1.5rem;
            font-size: 0.85rem;
            color: var(--fg-dim);
            font-style: italic;
            height: 24px;
        }

        /* Input Bar */
        .chat-input-area {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--bg-soft);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            background-color: var(--bg-soft);
            border: 1px solid var(--bg-element);
            padding: 12px 16px;
            border-radius: 8px;
            color: var(--fg);
            outline: none;
        }

        .chat-input:focus {
            border-color: var(--yellow);
        }

        .send-btn {
            background-color: var(--yellow);
            color: var(--bg-hard);
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Login Modal -->
    <div id="login-overlay" class="login-overlay">
        <div class="login-box">
            <h2><i class="fa-solid fa-comments"></i> GruvChat</h2>
            <input type="text" id="username-input" class="input-field" placeholder="Kullanıcı adı girin..." maxlength="20">
            <button id="login-btn" class="btn">Sohbete Katıl</button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-fire"></i> GruvChat
            </div>
            <div class="section-title">Çevrimiçi (5 Sınır)</div>
            <ul class="user-list" id="user-list">
                <!-- Aktif kullanıcılar buraya dinamik eklenecek -->
            </ul>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <div>
                    <h3 style="color: var(--fg)">Genel Kanal</h3>
                    <small style="color: var(--fg-dim)">5 Kişilik Özel Sohbet Odası</small>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages">
                <!-- Mesajlar dinamik yüklenecek -->
            </div>

            <div class="typing-indicator" id="typing-indicator"></div>

            <div class="chat-input-area">
                <input type="text" id="message-input" class="chat-input" placeholder="Bir mesaj yazın..." autocomplete="off">
                <button id="send-btn" class="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- Firebase Core SDK (v9 Modüler / CDNs) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, serverTimestamp, set, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        // FIREBASE YAPILANDIRMANIZI BURAYA EKLENİN
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // UI Elemanları
        const loginOverlay = document.getElementById('login-overlay');
        const usernameInput = document.getElementById('username-input');
        const loginBtn = document.getElementById('login-btn');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const chatMessages = document.getElementById('chat-messages');
        const userList = document.getElementById('user-list');
        const typingIndicator = document.getElementById('typing-indicator');

        let currentUser = localStorage.getItem('gruv_username') || null;
        let currentAvatar = '';
        let typingTimeout = null;

        // Oturum Yönetimi
        function initApp() {
            if (currentUser) {
                loginOverlay.classList.add('hidden');
                setupUserSession();
            }
        }

        loginBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (name) {
                currentUser = name;
                localStorage.setItem('gruv_username', currentUser);
                loginOverlay.classList.add('hidden');
                setupUserSession();
            }
        });

        function setupUserSession() {
            currentAvatar = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(currentUser)}`;
            
            // Online Durumu Ekleme
            const userRef = ref(database, `online_users/${currentUser}`);
            set(userRef, { username: currentUser, avatar: currentAvatar });
            onDisconnect(userRef).remove();

            listenMessages();
            listenOnlineUsers();
            listenTyping();
        }

        // 1. MESAJ GÖNDERME
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !currentUser) return;

            const messagesRef = ref(database, 'messages');
            push(messagesRef, {
                sender: currentUser,
                avatar: currentAvatar,
                text: text,
                timestamp: serverTimestamp()
            });

            messageInput.value = '';
            setTypingStatus(false);
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // 2. MESAJLARI DİNLEME VE ANİMASYONLU RENDER
        function listenMessages() {
            const messagesRef = ref(database, 'messages');
            onValue(messagesRef, (snapshot) => {
                chatMessages.innerHTML = '';
                const data = snapshot.val();
                if (!data) return;

                Object.values(data).forEach(msg => {
                    const isMe = msg.sender === currentUser;
                    const msgDiv = document.createElement('div');
                    
                    // 'message-animate' sınıfı sayesinde mesajlar ekrana animasyonla gelir
                    msgDiv.className = `message-item message-animate ${isMe ? 'me' : ''}`;
                    
                    const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

                    msgDiv.innerHTML = `
                        <img src="${msg.avatar}" class="msg-avatar" alt="avatar">
                        <div class="msg-bubble">
                            <div class="msg-header">
                                <span class="msg-sender">${msg.sender}</span>
                                <span class="msg-time">${timeStr}</span>
                            </div>
                            <div class="msg-text">${escapeHTML(msg.text)}</div>
                        </div>
                    `;

                    chatMessages.appendChild(msgDiv);
                });

                // Otomatik aşağı kaydırma
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }

        // 3. ÇEVRİMİÇİ KULLANICILAR DİNLEME
        function listenOnlineUsers() {
            const onlineRef = ref(database, 'online_users');
            onValue(onlineRef, (snapshot) => {
                userList.innerHTML = '';
                const users = snapshot.val();
                if (!users) return;

                Object.values(users).forEach(u => {
                    const li = document.createElement('li');
                    li.className = 'user-item';
                    li.innerHTML = `
                        <img src="${u.avatar}" class="user-avatar" alt="avatar">
                        <span style="flex:1; font-size: 0.9rem;">${escapeHTML(u.username)}</span>
                        <span class="online-dot"></span>
                    `;
                    userList.appendChild(li);
                });
            });
        }

        // 4. YAZIYOR... GÖSTERGESİ
        messageInput.addEventListener('input', () => {
            setTypingStatus(true);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => setTypingStatus(false), 2000);
        });

        function setTypingStatus(isTyping) {
            if (!currentUser) return;
            const typingRef = ref(database, `typing/${currentUser}`);
            if (isTyping) {
                set(typingRef, true);
                onDisconnect(typingRef).remove();
            } else {
                remove(typingRef);
            }
        }

        function listenTyping() {
            const typingRef = ref(database, 'typing');
            onValue(typingRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    typingIndicator.innerText = '';
                    return;
                }
                const typers = Object.keys(data).filter(name => name !== currentUser);
                if (typers.length > 0) {
                    typingIndicator.innerText = `${typers.join(', ')} yazıyor...`;
                } else {
                    typingIndicator.innerText = '';
                }
            });
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        initApp();
    </script>
</body>
</html>
