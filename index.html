<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Gruvbox Chat</title>
    <style>
        :root {
            --bg-dark: #282828;
            --bg-panel: #1d2021;
            --bg-sidebar: #3c3836;
            --bg-chat: #32302f;
            --fg-text: #ebdbb2;
            --fg-sub: #a89984;
            --accent-green: #b8bb26;
            --accent-yellow: #fabd2f;
            --accent-blue: #83a598;
            --bubble-me: #458588;
            --bubble-other: #504945;
            --border-color: #504945;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-dark); color: var(--fg-text); height: 100vh; display: flex; overflow: hidden; }

        /* MODAL (KULLANICI ADI GİRİŞİ) */
        #userModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 99; }
        .modal-card { background: var(--bg-panel); border: 2px solid var(--accent-yellow); padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; }
        .modal-card h3 { color: var(--accent-yellow); margin-bottom: 15px; }
        .modal-card input { width: 100%; padding: 12px; background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--fg-text); border-radius: 6px; font-size: 16px; margin-bottom: 15px; outline: none; }
        .modal-card input:focus { border-color: var(--accent-yellow); }
        .modal-card button { width: 100%; padding: 12px; background: var(--accent-yellow); border: none; font-weight: bold; color: var(--bg-dark); border-radius: 6px; cursor: pointer; font-size: 16px; }

        /* ANA EKRAN DÜZENİ */
        .app-container { display: flex; width: 100%; height: 100%; }

        /* SIDEBAR */
        .sidebar { width: 280px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-color); font-weight: bold; color: var(--accent-yellow); font-size: 18px; }
        .room-list { flex: 1; padding: 15px 10px; }
        .room-item { background: var(--bg-panel); padding: 12px; border-radius: 8px; border-left: 4px solid var(--accent-green); color: var(--fg-text); }
        .user-profile { padding: 15px; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel); }
        .user-profile span { font-size: 14px; color: var(--accent-blue); font-weight: bold; }
        .btn-change-user { background: transparent; border: 1px solid var(--fg-sub); color: var(--fg-sub); padding: 4px 8px; font-size: 12px; border-radius: 4px; cursor: pointer; }

        /* SOHBET ALANI */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); }
        .chat-header { padding: 18px 25px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .chat-header h2 { font-size: 16px; color: var(--fg-text); }
        .status-dot { height: 8px; width: 8px; background-color: var(--accent-green); border-radius: 50%; display: inline-block; margin-right: 6px; }

        /* MESAJ LİSTESİ */
        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message-row { display: flex; flex-direction: column; max-width: 70%; }
        .message-row.me { align-self: flex-end; align-items: flex-end; }
        .message-row.other { align-self: flex-start; align-items: flex-start; }

        .sender-name { font-size: 11px; color: var(--fg-sub); margin-bottom: 4px; }
        .bubble { padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .message-row.me .bubble { background: var(--bubble-me); color: #fff; border-bottom-right-radius: 2px; }
        .message-row.other .bubble { background: var(--bubble-other); color: var(--fg-text); border-bottom-left-radius: 2px; }
        .timestamp { font-size: 10px; color: rgba(255,255,255,0.6); margin-top: 5px; text-align: right; }

        /* MESAJ INPUT */
        .input-area { padding: 15px 25px; background: var(--bg-panel); border-top: 1px solid var(--border-color); display: flex; gap: 10px; }
        .input-area textarea { flex: 1; background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--fg-text); border-radius: 8px; padding: 12px; resize: none; height: 48px; font-family: inherit; font-size: 14px; outline: none; }
        .input-area textarea:focus { border-color: var(--accent-yellow); }
        .input-area button { background: var(--accent-yellow); border: none; padding: 0 24px; border-radius: 8px; font-weight: bold; color: var(--bg-dark); cursor: pointer; }

        @media (max-width: 768px) { .sidebar { display: none; } }
    </style>
</head>
<body>

    <!-- KULLANICI ADI MODALI -->
    <div id="userModal">
        <div class="modal-card">
            <h3>Instant Chat</h3>
            <p style="color: var(--fg-sub); font-size: 13px; margin-bottom: 15px;">Kullanıcı adınızı girin ve anlık sohbete başlayın.</p>
            <input type="text" id="usernameInput" placeholder="Kullanıcı Adınız..." />
            <button id="joinBtn">Sohbete Katıl</button>
        </div>
    </div>

    <!-- ANA ARAYÜZ -->
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">Instant Messenger</div>
            <div class="room-list">
                <div class="room-item">
                    <strong># global-chat</strong>
                    <p style="font-size: 12px; color: var(--fg-sub); margin-top: 4px;">Anlık Mesajlaşma</p>
                </div>
            </div>
            <div class="user-profile">
                <span id="displayUsername">...</span>
                <button class="btn-change-user" id="resetUserBtn">Değiştir</button>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <h2><span class="status-dot"></span># global-chat</h2>
            </div>

            <div class="messages-container" id="messagesList">
                <div style="color:var(--fg-sub); text-align:center;">Bağlanıyor...</div>
            </div>

            <form class="input-area" id="chatForm">
                <textarea id="messageInput" placeholder="Bir mesaj yazın..." required></textarea>
                <button type="submit">Gönder</button>
            </form>
        </div>
    </div>

    <!-- FIREBASE MODULE SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // MessGes projesinin güncel konfigürasyon bilgileri
        const firebaseConfig = {
            apiKey: "AIzaSyDRiCdkBRsKMeUpCmznQ3Sn8R6SvBk0C9U",
            authDomain: "messges-87869.firebaseapp.com",
            databaseURL: "https://messges-87869-default-rtdb.firebaseio.com",
            projectId: "messges-87869",
            storageBucket: "messges-87869.firebasestorage.app",
            messagingSenderId: "102076170891",
            appId: "1:102076170891:web:8786547acdbcdfb1468a8e"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const messagesRef = ref(database, 'messages');

        let currentUser = localStorage.getItem('gh_chat_username') || "";

        const userModal = document.getElementById('userModal');
        const displayUsername = document.getElementById('displayUsername');
        const messagesList = document.getElementById('messagesList');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');

        // Kullanıcı Kontrolü
        if (currentUser) {
            userModal.style.display = 'none';
            displayUsername.innerText = currentUser;
        }

        document.getElementById('joinBtn').addEventListener('click', () => {
            const input = document.getElementById('usernameInput').value.trim();
            if (input) {
                currentUser = input;
                localStorage.setItem('gh_chat_username', input);
                userModal.style.display = 'none';
                displayUsername.innerText = currentUser;
            }
        });

        document.getElementById('resetUserBtn').addEventListener('click', () => {
            localStorage.removeItem('gh_chat_username');
            location.reload();
        });

        // 1. ANLIK MESAJ DİNLEME (Realtime WebSocket)
        onValue(messagesRef, (snapshot) => {
            const data = snapshot.val();
            messagesList.innerHTML = "";

            if (!data) {
                messagesList.innerHTML = '<div style="color:var(--fg-sub); text-align:center;">Henüz mesaj yok. İlk mesajı sen at!</div>';
                return;
            }

            Object.values(data).forEach(msg => {
                const isMe = msg.sender.toLowerCase() === currentUser.toLowerCase();
                const row = document.createElement('div');
                row.className = `message-row ${isMe ? 'me' : 'other'}`;

                const dateStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) : '';

                row.innerHTML = `
                    <div class="sender-name">${escapeHTML(msg.sender)}</div>
                    <div class="bubble">
                        ${escapeHTML(msg.text)}
                        <div class="timestamp">${dateStr}</div>
                    </div>
                `;
                messagesList.appendChild(row);
            });

            // Otomatik en aşağı kaydır
            messagesList.scrollTop = messagesList.scrollHeight;
        });

        // 2. MESAJ GÖNDERME
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !currentUser) return;

            push(messagesRef, {
                sender: currentUser,
                text: text,
                timestamp: serverTimestamp()
            });

            messageInput.value = "";
        });

        // Enter ile Gönderme (Shift+Enter alt satıra geçer)
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
